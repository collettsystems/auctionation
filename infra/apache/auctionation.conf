# Apache 2.4 virtual host template for a LAMP-style Auctionation deployment.
# Enable required modules:
#   sudo a2enmod proxy proxy_http rewrite headers ssl

<VirtualHost *:80>
  ServerName auctions.example.com

  DocumentRoot /var/www/auctionation/admin

  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"

  ProxyPreserveHost On
  ProxyPass        /api http://127.0.0.1:3000
  ProxyPassReverse /api http://127.0.0.1:3000

  Alias /embed /var/www/auctionation/embed
  <Directory /var/www/auctionation/admin>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.html
  </Directory>

  <Directory /var/www/auctionation/embed>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    FallbackResource /index.html
  </Directory>

  ErrorLog ${APACHE_LOG_DIR}/auctionation-error.log
  CustomLog ${APACHE_LOG_DIR}/auctionation-access.log combined
</VirtualHost>