services:
  postgres:
    image: postgres:16-alpine
    container_name: auctionation-postgres
    init: true
    environment:
      POSTGRES_DB: auctionation
      POSTGRES_USER: auctionation
      POSTGRES_PASSWORD: auctionation
    ports:
      - "5432:5432"
    volumes:
      - auctionation-postgres-data:/var/lib/postgresql/data
      - ./infra/sql/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
      - ./infra/sql/002_demo_seed.sql:/docker-entrypoint-initdb.d/002_demo_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auctionation -d auctionation"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  auctionation-postgres-data:
